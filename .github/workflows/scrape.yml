name: Scrape Foody

on:
  schedule:
    # Mỗi 3 giờ = 8 lần/ngày
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          data/venues.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run scraper
      run: python scrape_foody_github.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f data/venues.json
        git diff --staged --quiet || git commit -m "Update venues $(date -u '+%Y-%m-%d %H:%M')"
        git push
